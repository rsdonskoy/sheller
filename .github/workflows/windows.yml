name: windows

# Manual or pull-request CI (gh workflow run for an on-demand run).
# Pushes to main stay un-billed.
on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-release:
    runs-on: windows-2022
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap vcpkg
        shell: cmd
        run: |
          git clone https://github.com/microsoft/vcpkg.git "%VCPKG_ROOT%"
          call "%VCPKG_ROOT%\bootstrap-vcpkg.bat" -disableMetrics

      - name: Install nasm
        # the corpus blob rules (tests/CMakeLists) invoke nasm directly;
        # the runner image does not ship it
        shell: cmd
        run: |
          choco install nasm -y --no-progress
          echo PATH=C:\Program Files\NASM;%PATH%>> "%GITHUB_ENV%"

      - name: CLI module include boundary check
        # bash: the runner's Git Bash ships grep; the default windows shell
        # (cmd) has none
        shell: bash
        run: |
          if grep -rnE '#[[:space:]]*include[[:space:]]*[<"]\.\./' src/cli/; then
            echo "::error::relative-parent include found in the CLI module (public headers only)"
            exit 1
          fi

      - name: Configure
        run: cmake --preset windows-release

      - name: Build
        run: cmake --build --preset windows-release

      - name: Export surface gate
        # The gate resolves dumpbin/undname from the configured toolchain
        # directory (CMAKE_LINKER's directory), not from PATH - this job's shell
        # is cmd and the VS tools are not on it. Same ctest entry as the full run
        # below, promoted to its own node so a drifted face names the symbol;
        # --no-tests=error so an unregistered gate cannot read as a pass.
        run: ctest --preset windows-release -R export_surface --no-tests=error

      - name: Test
        # -E: the machine-sensitive set. event_baseline / exception_e2e /
        # behavior_e2e / loader_byhash_x86_e2e carry layout-derived goldens
        # that only match the machine that generated them (the local norm is
        # 36/40 = clean-tree same set). capture_x86_e2e's double-capture
        # determinism does not hold on runner hardware (exit 5 vs 4 between
        # two live WOW64 captures). dll_capture_e2e replays the captured DLL
        # world: the payload's per-process entropy crashes its CRT init past
        # the OEP on runner hardware (green on the development machine; same
        # live-capture family). All excluded until those normalization gaps
        # close.
        run: ctest --preset windows-release -E "event_baseline|exception_e2e|behavior_e2e|loader_byhash_x86_e2e|capture_x86_e2e|dll_capture_e2e"
